<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <title>Photoshoot Request Form</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }
    
    #successMessage{
      display:none;
      text-align:center;
      margin-top:20px;
      color:#7CFC00;
      font-weight:600;
      font-size:16px;
    }

    .title-flex{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}

.top-button-area{
  margin-top:20px;
}

.top-link-btn{
  display:inline-block;
  padding:14px 28px;
  border-radius:16px;
  text-decoration:none;
  color:white;
  font-size:16px;
  font-weight:600;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  transition:0.3s;
  box-shadow:0 12px 25px rgba(99,102,241,0.4);
}

.top-link-btn:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 18px 35px rgba(99,102,241,0.6);
}

/* Camera Line Icon */
.camera-line{
  width:55px;
  height:38px;
  border:3px solid #38bdf8;
  border-radius:10px;
  position:relative;
  animation:float 2s ease-in-out infinite;
}

/* Camera Top */
.camera-line::before{
  content:'';
  position:absolute;
  width:18px;
  height:8px;
  border:3px solid #38bdf8;
  border-bottom:none;
  border-radius:8px 8px 0 0;
  top:-11px;
  left:7px;
}

/* Lens */
.lens{
  width:18px;
  height:18px;
  border:3px solid #a78bfa;
  border-radius:50%;
  position:absolute;
  top:7px;
  left:16px;
  animation:pulse 1.5s infinite;
}

/* Flash */
.flash{
  width:6px;
  height:6px;
  background:#38bdf8;
  border-radius:50%;
  position:absolute;
  top:8px;
  right:8px;
  animation:blink 1s infinite;
}

/* Animations */
@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-5px);
  }
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.15);
  }
}

@keyframes blink{
  0%,100%{
    opacity:1;
  }
  50%{
    opacity:0.3;
  }
}

    body{
      min-height:100vh;
      overflow-x:hidden;
      background:#0f172a;
      color:#fff;
      position:relative;
    }

    /* Animated Background */
    .background{
      position:fixed;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:-1;
      top:0;
      left:0;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    }

    .background span{
      position:absolute;
      display:block;
      width:20px;
      height:20px;
      background:rgba(255,255,255,0.1);
      animation:animate 25s linear infinite;
      bottom:-150px;
      border-radius:50%;
      backdrop-filter: blur(5px);
    }

    .background span:nth-child(1){
      left:10%;
      width:80px;
      height:80px;
      animation-delay:0s;
    }

    .background span:nth-child(2){
      left:20%;
      width:40px;
      height:40px;
      animation-delay:2s;
      animation-duration:12s;
    }

    .background span:nth-child(3){
      left:35%;
      width:60px;
      height:60px;
      animation-delay:4s;
    }

    .background span:nth-child(4){
      left:50%;
      width:100px;
      height:100px;
      animation-delay:0s;
      animation-duration:18s;
    }

    .background span:nth-child(5){
      left:65%;
      width:50px;
      height:50px;
      animation-delay:0s;
    }

    .background span:nth-child(6){
      left:80%;
      width:70px;
      height:70px;
      animation-delay:3s;
    }

    .background span:nth-child(7){
      left:90%;
      width:90px;
      height:90px;
      animation-delay:7s;
    }

    @keyframes animate{
      0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
      }
      100%{
        transform:translateY(-1200px) rotate(720deg);
        opacity:0;
      }
    }

    .container{
      width:95%;
      max-width:1100px;
      margin:40px auto;
      padding:20px;
    }

    .form-box{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(12px);
      border-radius:25px;
      padding:40px;
      box-shadow:0 8px 32px rgba(0,0,0,0.3);
      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .title{
      text-align:center;
      margin-bottom:35px;
    }

    .title h1{
      font-size:40px;
      font-weight:700;
      background:linear-gradient(90deg,#38bdf8,#a78bfa);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .title p{
      color:#cbd5e1;
      margin-top:10px;
    }

    .section{
      margin-bottom:30px;
      padding:25px;
      border-radius:18px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      transition:0.3s;
    }

    .section:hover{
      transform:translateY(-3px);
      background:rgba(255,255,255,0.07);
    }

    .section-title{
      font-size:20px;
      margin-bottom:20px;
      color:#38bdf8;
      font-weight:600;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
    }

    label{
      margin-bottom:8px;
      font-size:14px;
      font-weight:500;
      color:#e2e8f0;
    }

    input,
    select,
    textarea{
      padding:14px;
      border:none;
      border-radius:12px;
      outline:none;
      background:rgba(255,255,255,0.12);
      color:#fff;
      font-size:14px;
      transition:0.3s;
    }

    input:focus,
    select:focus,
    textarea:focus{
      background:rgba(255,255,255,0.18);
      box-shadow:0 0 0 2px #38bdf8;
    }

    option{
      color:#000;
    }

    textarea{
      resize:none;
      min-height:100px;
    }

    .full{
      grid-column:1 / -1;
    }

    .btn-submit{
      width:100%;
      padding:16px;
      border:none;
      border-radius:14px;
      background:linear-gradient(90deg,#38bdf8,#8b5cf6);
      color:#fff;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:20px;
    }

    .btn-submit:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(56,189,248,0.4);
    }

    @media(max-width:768px){
      .form-box{
        padding:20px;
      }

      .title h1{
        font-size:28px;
      }
    }
  </style>
</head>

<div id="successMessage">

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxt2BobMrneEA9akBKmheBLHciO2ucAIEWJF_GVxPxD1UxGFOkegIXkLiXEfsYXkx0KtQ/exec";

document
  .getElementById("photoForm")
  .addEventListener("submit", async function(e){

    e.preventDefault();

    const form = e.target;

    const formData = {
      id: form.id.value,
      name: form.name.value,
      position: form.position.value,
      phone: form.phone.value,
      email: form.email.value,
      department: form.department.value,
      purpose: form.purpose.value,
      campus: form.Campus.value,
      topic: form.topic.value,
      hosted_by: form.hosted_by.value,
      attendees: form.attendees.value,
      venue: form.venue.value,
      start_date: form.start_date.value,
      end_date: form.end_date.value,
      morning_start: form.morning_start.value,
      morning_end: form.morning_end.value,
      afternoon_start: form.afternoon_start.value,
      afternoon_end: form.afternoon_end.value,
      evening_start: form.evening_start.value,
      evening_end: form.evening_end.value,
      photographer: form.photographer.value,
      notes: form.notes.value
    };

    try {

      const response = await fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(formData)
      });

      const result = await response.json();

      if(result.result === "success"){
       successMessage.style.display = "block";
        form.reset();
         setTimeout(() => {
          successMessage.style.display = "none";
        }, 1000);
      }

    } catch(error){
      alert("Error submitting form");
      console.error(error);
    }

});

</script>
