<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sound System Request Form</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    .speaker-wrapper{
  position:fixed;
  top:5%;
  left:20%;
  transform:translate(-50%, -50%);
  z-index:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

    /* Speaker Animation */
    .speaker{
      width:60px;
      height:60px;
      background:#0ea5e9;
      border-radius:50%;
      position:relative;
      box-shadow:0 0 25px #38bdf8;
      animation:bounce 2s infinite;
    }

    .speaker::before,
    .speaker::after{
      content:'';
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      border:3px solid #38bdf8;
      border-radius:50%;
      animation:ring 2s infinite;
    }

    .speaker::before{
      width:85px;
      height:85px;
    }

    .speaker::after{
      width:110px;
      height:110px;
      animation-delay:0.5s;
    }

     .speaker{
        width:50px;
        height:50px;
      }

    @keyframes ring{
      0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(0.7);
      }
      100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.5);
      }
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    body{
      min-height:100vh;
      background:#0f172a;
      overflow-x:hidden;
      padding:40px 20px;
      position:relative;
      color:white;
    }

    /* Animated Sound Wave Background */
    .wave{
      position:absolute;
      width:200%;
      height:200px;
      background:rgba(0,198,255,0.08);
      border-radius:45%;
      animation:waveMove 10s linear infinite;
      z-index:0;
    }

    .wave1{
      top:10%;
      left:-50%;
    }

    .wave2{
      top:50%;
      left:-50%;
      animation-duration:15s;
      background:rgba(255,255,255,0.05);
    }

    .wave3{
      top:80%;
      left:-50%;
      animation-duration:18s;
      background:rgba(0,114,255,0.06);
    }

    @keyframes waveMove{
      from{
        transform:translateX(0) rotate(0deg);
      }
      to{
        transform:translateX(25%) rotate(360deg);
      }
    }

    .container{
      position:relative;
      z-index:2;
      max-width:1200px;
      margin:auto;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:25px;
      padding:40px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .header{
      text-align:center;
      margin-bottom:35px;
    }

    .header h1{
      font-size:40px;
      margin-bottom:10px;
    }

    .header p{
      opacity:0.8;
    }

    .sound-icon{
      font-size:60px;
      display:inline-block;
      animation:bounce 1.5s infinite;
      margin-bottom:15px;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-12px);
      }
    }

    form{
      display:flex;
      flex-direction:column;
      gap:25px;
    }

    /* Section Style */
    .section{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:20px;
      padding:25px;
      transition:0.3s;
    }

    .section-title{
      font-size:20px;
      font-weight:600;
      margin-bottom:20px;
      color:#00c6ff;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .input-box{
      display:flex;
      flex-direction:column;
    }

    .input-box label{
      margin-bottom:8px;
      font-size:14px;
      font-weight:500;
    }

    .input-box input,
    .input-box select,
    .input-box textarea{
      padding:14px;
      border:none;
      border-radius:12px;
      outline:none;
      background:rgba(255,255,255,0.1);
      color:white;
      border:1px solid rgba(255,255,255,0.1);
      font-size:14px;
    }

    .input-box input::placeholder,
    .input-box textarea::placeholder{
      color:#ddd;
    }

    .input-box select option{
      color:black;
    }

    textarea{
      min-height:120px;
      resize:none;
    }

    .full{
      grid-column:1/-1;
    }

    .submit-area{
      text-align:center;
      margin-top:10px;
    }

    /* Animated Audio Background */
    .audio-bg{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      height:160px;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      gap:8px;
      z-index:0;
      opacity:0.25;
    }

    .bar{
      width:10px;
      background:#38bdf8;
      border-radius:20px;
      animation:sound 1s infinite ease-in-out;
    }

    .bar:nth-child(1){height:40px;animation-delay:0s;}
    .bar:nth-child(2){height:90px;animation-delay:0.2s;}
    .bar:nth-child(3){height:60px;animation-delay:0.4s;}
    .bar:nth-child(4){height:120px;animation-delay:0.1s;}
    .bar:nth-child(5){height:70px;animation-delay:0.5s;}
    .bar:nth-child(6){height:140px;animation-delay:0.3s;}
    .bar:nth-child(7){height:90px;animation-delay:0.6s;}
    .bar:nth-child(8){height:60px;animation-delay:0.2s;}
    .bar:nth-child(9){height:110px;animation-delay:0.4s;}
    .bar:nth-child(10){height:80px;animation-delay:0.7s;}

    @keyframes sound{
      0%,100%{
        transform:scaleY(0.5);
      }
      50%{
        transform:scaleY(1.5);
      }
    }

@keyframes glow{
      from{
        text-shadow:0 0 10px #38bdf8;
      }
      to{
        text-shadow:0 0 25px #0ea5e9;
      }
    }

    .top-button-area{
  margin-top:20px;
}

.top-link-btn{
  display:inline-block;
  padding:14px 28px;
  border-radius:16px;
  text-decoration:none;
  color:white;
  font-size:16px;
  font-weight:600;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  transition:0.3s;
  box-shadow:0 12px 25px rgba(99,102,241,0.4);
}

.top-link-btn:hover{
  transform:translateY(-3px) scale(1.03);

}

.section:hover{

      font-size:16px;

    }

    button:hover{

    }

    #successMessage{
      display:none;
      text-align:center;
      margin-top:20px;
      color:#7CFC00;
      font-weight:600;
      font-size:16px;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    @media(max-width:768px){

      .container{
        padding:25px;
      }

      .header h1{
        font-size:28px;
      }

    }
     @keyframes sound{
      0%,100%{
        transform:scaleY(0.5);
      }
      50%{
        transform:scaleY(1.5);
      }
    }

  </style>
</head>

  <script>

    // =========================================
    // GOOGLE APPS SCRIPT WEB APP URL
    // =========================================

    const scriptURL = "https://script.google.com/macros/s/AKfycbzwl3m4NUVMjrxqD4kKX6zO6jakMpHYm70YeCWiOt1I8-LLSI7-JU5grmBuLPYqm_nN/exec";

    const form = document.getElementById("soundForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", e => {

      e.preventDefault();

      fetch(scriptURL, {
        method: "POST",
        body: new FormData(form)
      })

      .then(response => {

        successMessage.style.display = "block";

        form.reset();

        setTimeout(() => {
          successMessage.style.display = "none";
        }, 1000);

      })

      .catch(error => {

        alert("Error submitting form!");

        console.error(error);

      });

    });

  </script>
